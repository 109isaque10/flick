name: Build Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code (integer, e.g., 1)'
        required: true
        default: '1'
        type: string
      build_format:
        description: 'Build format (apk, aab, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'aab'
      create_github_release:
        description: 'Create a GitHub Release draft with the signed outputs?'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version Parameters
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V_NAME="${{ github.event.inputs.version_name }}"
            V_CODE="${{ github.event.inputs.version_code }}"
            FORMAT="${{ github.event.inputs.build_format }}"
            CREATE_REL="${{ github.event.inputs.create_github_release }}"
          else
            # Triggered by tag (e.g. v1.2.0)
            TAG_REF="${{ github.ref_name }}"
            V_NAME="${TAG_REF#v}"
            # Use GitHub run number as unique incrementing version code for tag builds
            V_CODE="${{ github.run_number }}"
            FORMAT="both"
            CREATE_REL="true"
          fi

          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "BUILD_FORMAT=$FORMAT" >> $GITHUB_ENV
          echo "CREATE_RELEASE=$CREATE_REL" >> $GITHUB_ENV

          echo "Target Version Name: $V_NAME"
          echo "Target Version Code: $V_CODE"
          echo "Build Format: $FORMAT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret RELEASE_KEYSTORE_BASE64 or KEYSTORE_BASE64 in GitHub Secrets!"
            echo "Please encode your release .jks keystore using: base64 -w 0 my-upload-key.jks"
            echo "And add it as 'RELEASE_KEYSTORE_BASE64' under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$STORE_PWD" ] || [ -z "$KEY_PWD" ]; then
            echo "::error::Missing STORE_PASSWORD or KEY_PASSWORD in GitHub Secrets!"
            echo "Please set RELEASE_STORE_PASSWORD and RELEASE_KEY_PASSWORD (or STORE_PASSWORD / KEY_PASSWORD) in GitHub Secrets."
            exit 1
          fi

          KEYSTORE_DEST="${{ github.workspace }}/my-upload-key.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_DEST"

          if [ ! -s "$KEYSTORE_DEST" ]; then
            echo "::error::Failed to decode keystore! Output file is empty."
            exit 1
          fi

          echo "Keystore decoded successfully to $KEYSTORE_DEST"
          echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Signed Android Package(s)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          GRADLE_TASKS=""
          if [ "$BUILD_FORMAT" = "apk" ]; then
            GRADLE_TASKS="assembleRelease"
          elif [ "$BUILD_FORMAT" = "aab" ]; then
            GRADLE_TASKS="bundleRelease"
          else
            GRADLE_TASKS="assembleRelease bundleRelease"
          fi

          echo "Executing: ./gradlew $GRADLE_TASKS -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME"
          ./gradlew $GRADLE_TASKS \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon \
            --stacktrace

      - name: Rename Release Files with Version Tag
        run: |
          mkdir -p release-artifacts
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk release-artifacts/StremFlix-v${VERSION_NAME}-c${VERSION_CODE}-release.apk
          fi
          if ls app/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
            cp app/build/outputs/bundle/release/*.aab release-artifacts/StremFlix-v${VERSION_NAME}-c${VERSION_CODE}-release.aab
          fi
          ls -lah release-artifacts/

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}-build-${{ env.VERSION_CODE }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: StremFlix v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          files: release-artifacts/*
          body: |
            ## StremFlix Release v${{ env.VERSION_NAME }}
            - **Version Code**: `${{ env.VERSION_CODE }}`
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.run_started_at }}`

            ### Downloads:
            - **APK**: For direct sideloading and testing on Android devices.
            - **AAB**: Android App Bundle ready for Google Play Store upload.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}