name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code (integer, e.g., 1)'
        required: true
        default: '1'
        type: string
      build_format:
        description: 'Build format (apk, aab, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'aab'
      create_github_release:
        description: 'Create a GitHub Release (publish directly) with the signed outputs?'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      # -------------------------------------------------------------
      # 1️⃣ Checkout
      # -------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # shallow clone – enough for building

      # -------------------------------------------------------------
      # 2️⃣ Set version‑related env vars (single source of truth)
      # -------------------------------------------------------------
      - name: Set version env
        id: version
        run: |
          # For a manual dispatch we use the explicit inputs.
          # For a tag push we derive the version name from the tag (strip the leading “v”)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION_NAME=${{ github.event.inputs.version_name }}" >> $GITHUB_ENV
            echo "VERSION_CODE=${{ github.event.inputs.version_code }}" >> $GITHUB_ENV
          else
            TAG=${{ github.ref_name }}               # e.g. v1.2.3
            echo "VERSION_NAME=${TAG#v}" >> $GITHUB_ENV   # strip the “v”
            echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV   # same logic as original
          fi

          echo "FORMAT=${{ github.event.inputs.build_format }}" >> $GITHUB_ENV
          echo "CREATE_RELEASE=${{ github.event.inputs.create_github_release }}" >> $GITHUB_ENV

          echo "Target Version Name: $VERSION_NAME"
          echo "Target Version Code: $VERSION_CODE"
          echo "Build Format: $FORMAT"
          echo "Create Release: $CREATE_RELEASE"

      # -------------------------------------------------------------
      # 3️⃣ Java & Gradle setup (cached)
      # -------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle wrapper (ensure it’s up‑to‑date)
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapperVersion: 'latest'

      # -------------------------------------------------------------
      # 4️⃣ Decode the release keystore (if a secret is supplied)
      # -------------------------------------------------------------
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_DEST="${{ github.workspace }}/my-upload-key.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_DEST"
          echo "KEYSTORE_PATH=$KEYSTORE_DEST" >> $GITHUB_ENV

      # -------------------------------------------------------------
      # 5️⃣ Build the required artifact(s) (single Gradle invocation)
      # -------------------------------------------------------------
      - name: Build signed artifacts
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          # Choose the Gradle tasks based on the requested format
          if [ "$FORMAT" = "apk" ]; then
            ./gradlew assembleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon \
              --parallel \
              --max-workers=2
            cp app/build/outputs/apk/release/*.apk release-artifacts/Flick-${VERSION_NAME}-c${VERSION_CODE}.apk
          elif [ "$FORMAT" = "aab" ]; then
            ./gradlew bundleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon \
              --parallel \
              --max-workers=2
            cp app/build/outputs/bundle/release/*.aab release-artifacts/Flick-${VERSION_NAME}-c${VERSION_CODE}.aab
          else   # both
            ./gradlew assembleRelease bundleRelease \
              -PversionName="${VERSION_NAME}" \
              -PversionCode="${VERSION_CODE}" \
              --no-daemon \
              --parallel \
              --max-workers=2
            cp app/build/outputs/apk/release/*.apk release-artifacts/Flick-${VERSION_NAME}-c${VERSION_CODE}.apk
            cp app/build/outputs/bundle/release/*.aab release-artifacts/Flick-${VERSION_NAME}-c${VERSION_CODE}.aab
          fi

      # -------------------------------------------------------------
      # 6️⃣ Upload the built artifacts (as a single workflow artifact)
      # -------------------------------------------------------------
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flick-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: release-artifacts/*
          retention-days: 30

      # -------------------------------------------------------------
      # 7️⃣ (Optional) Publish a GitHub Release
      # -------------------------------------------------------------
      - name: Publish GitHub Release
        if: env.CREATE_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Flick v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          draft: false          # publish directly; remove the draft flag
          prerelease: false
          files: release-artifacts/*

